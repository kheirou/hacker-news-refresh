name: Bug report
description: Something looks wrong or does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the HN page URL if it matters.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Extension and Firefox versions
      placeholder: "1.0.0 / Firefox 142"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or console output
